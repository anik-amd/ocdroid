name: Build OCDroid APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default to read-only. Only the release job may write a release.
permissions:
  contents: read

concurrency:
  group: ocdroid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

  verify-build:
    name: Debug build (pull requests)
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

  release:
    name: Signed release APK
    if: github.repository == 'anik-amd/ocdroid' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Read app version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing OCDroid v$VERSION"

      - name: Mirror official web client
        env:
          OC_SERVER_URL: ${{ secrets.OC_SERVER_URL }}
          OC_SERVER_USERNAME: ${{ secrets.OC_SERVER_USERNAME }}
          OC_SERVER_PASSWORD: ${{ secrets.OC_SERVER_PASSWORD }}
        run: |
          if [ -z "$OC_SERVER_URL" ]; then
            echo "::warning::OC_SERVER_URL is not configured; the APK will use the live web UI without an offline mirror."
          else
            node scripts/fetch-web-assets.mjs
          fi

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing signing secrets (KEYSTORE_BASE64, KEYSTORE_ALIAS, KEYSTORE_PASSWORD)"
            exit 1
          fi
          umask 077
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          {
            echo "keystore=keystore/release.keystore"
            echo "keystore.alias=$KEYSTORE_ALIAS"
            echo "keystore.password=$KEYSTORE_PASSWORD"
          } > app/keystore/signing.properties

      # Run again in the release job so the signed APK cannot be built from a tree that
      # skipped tests, even if the job dependencies are edited later.
      - name: Unit tests before signing
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK and checksums
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          test -n "$APK"
          cp "$APK" dist/OCDroid.apk
          (cd dist && sha256sum OCDroid.apk > SHA256SUMS)
          cat dist/SHA256SUMS
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: OCDroid-apk
          path: |
            dist/OCDroid.apk
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish versioned release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OCDroid v${{ steps.version.outputs.version }}
          body_path: release-notes/OCDroid_${{ steps.version.outputs.version }}.md
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/OCDroid.apk
            dist/SHA256SUMS

      - name: Remove signing material
        if: always()
        run: rm -rf app/keystore
