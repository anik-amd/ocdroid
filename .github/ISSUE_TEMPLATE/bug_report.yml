name: Bug report
description: Report a reproducible problem with OCDroid
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact passwords, pairing tokens, tunnel hostnames and
        any private project names from logs and screenshots.

        For a security vulnerability, do **not** open this issue. Use
        https://github.com/anik-amd/ocdroid/security/advisories/new instead.

  - type: input
    id: app-version
    attributes:
      label: OCDroid version
      placeholder: "0.3.0 (versionCode 4)"
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: "Android 14, Pixel 8"
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Connection type
      options:
        - LAN over HTTP
        - HTTPS tunnel
        - USB / adb reverse
        - Not connected / setup screen
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open OCDroid
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots (redacted)
      description: Remove tokens, passwords, server hostnames and private project data.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets from this report.
          required: true
