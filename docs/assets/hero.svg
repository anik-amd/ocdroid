<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="OCDroid: the official OpenCode web UI in your pocket">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b12"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c9cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c9cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="28" fill="url(#dots)"/>
  <circle cx="1110" cy="50" r="240" fill="url(#glow)"/>
  <circle cx="170" cy="460" r="220" fill="#7c9cff" fill-opacity="0.07"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <g transform="translate(72 78)">
      <rect x="0" y="0" width="156" height="30" rx="15" fill="#7c9cff" fill-opacity="0.12" stroke="#7c9cff" stroke-opacity="0.35"/>
      <circle cx="18" cy="15" r="4" fill="#34d399"/>
      <text x="32" y="20" fill="#c7d2fe" font-size="13" font-weight="600" letter-spacing="0.4">ANDROID • OPEN SOURCE</text>

      <text x="0" y="104" fill="#f8fafc" font-size="64" font-weight="700" letter-spacing="-2">OCDroid</text>
      <text x="0" y="154" fill="#e2e8f0" font-size="27" font-weight="500">The official OpenCode web UI,</text>
      <text x="0" y="188" fill="#94a3b8" font-size="27" font-weight="500">in your pocket.</text>

      <text x="0" y="231" fill="#94a3b8" font-size="16">Pair once, then check agents, answer prompts and</text>
      <text x="0" y="254" fill="#94a3b8" font-size="16">get notified when work finishes — from your phone.</text>

      <g transform="translate(0 282)">
        <rect x="0" y="0" width="76" height="28" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
        <text x="38" y="19" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600">Android 8+</text>
        <rect x="86" y="0" width="52" height="28" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
        <text x="112" y="19" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600">MIT</text>
        <rect x="148" y="0" width="116" height="28" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
        <text x="206" y="19" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600">No telemetry</text>
      </g>

      <text x="0" y="348" fill="#7c9cff" font-size="15" font-weight="600">Made with OpenCode, for OpenCode.</text>
      <text x="0" y="371" fill="#64748b" font-size="13">Independent community project. Not affiliated with OpenCode or Anomaly.</text>
    </g>

    <g transform="translate(834 42)" filter="url(#shadow)">
      <rect x="0" y="0" width="278" height="396" rx="42" fill="#020617" stroke="#334155" stroke-width="2"/>
      <rect x="12" y="12" width="254" height="372" rx="32" fill="#0b1220"/>
      <circle cx="139" cy="25" r="3.5" fill="#334155"/>
      <rect x="12" y="40" width="254" height="1.5" fill="#1e293b"/>

      <g transform="translate(30 58)">
        <text x="0" y="0" fill="#f8fafc" font-size="14" font-weight="700">OpenCode</text>
        <text x="0" y="17" fill="#64748b" font-size="9">official web client</text>

        <g transform="translate(168 0)">
          <rect x="0" y="-14" width="46" height="28" rx="8" fill="#7c9cff" fill-opacity="0.12"/>
          <rect x="6" y="-9" width="16" height="16" rx="4" fill="none" stroke="#a5b4fc" stroke-width="1.4"/>
          <path d="M10 -6h8M10 -2h5M10 2h7" stroke="#a5b4fc" stroke-width="1.2" stroke-linecap="round"/>
          <text x="28" y="4" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="700">⌘</text>
        </g>

        <rect x="0" y="42" width="192" height="48" rx="12" fill="#111c2e" stroke="#1e293b"/>
        <rect x="12" y="56" width="86" height="6" rx="3" fill="#334155"/>
        <rect x="12" y="69" width="130" height="6" rx="3" fill="#1e293b"/>

        <rect x="34" y="106" width="160" height="44" rx="12" fill="#172554" stroke="#1d4ed8" stroke-opacity="0.35"/>
        <rect x="46" y="120" width="110" height="6" rx="3" fill="#60a5fa" fill-opacity="0.8"/>
        <rect x="46" y="133" width="80" height="6" rx="3" fill="#3b82f6" fill-opacity="0.45"/>

        <rect x="0" y="164" width="202" height="58" rx="12" fill="#111c2e" stroke="#1e293b"/>
        <rect x="12" y="178" width="104" height="6" rx="3" fill="#334155"/>
        <rect x="12" y="191" width="168" height="6" rx="3" fill="#1e293b"/>
        <rect x="12" y="204" width="140" height="6" rx="3" fill="#1e293b"/>

        <rect x="0" y="240" width="202" height="58" rx="12" fill="#111c2e" stroke="#1e293b"/>
        <rect x="12" y="254" width="70" height="6" rx="3" fill="#334155"/>
        <rect x="12" y="267" width="150" height="6" rx="3" fill="#1e293b"/>
        <rect x="12" y="280" width="120" height="6" rx="3" fill="#1e293b"/>

        <rect x="0" y="316" width="202" height="36" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="12" y="339" fill="#475569" font-size="10">Ask OpenCode…</text>
        <circle cx="186" cy="334" r="10" fill="#7c9cff" fill-opacity="0.9"/>
        <path d="M183 334h6m-2-2 2 2-2 2" stroke="#0b1220" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <g transform="translate(920 6)">
      <rect x="0" y="0" width="142" height="27" rx="13.5" fill="#0f172a" stroke="#7c9cff" stroke-opacity="0.35"/>
      <text x="71" y="18" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif">⌘ command palette</text>
    </g>
  </g>
</svg>
